name: Generate Tags

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        required: true
        description: Release type (version bump)
        options: [patch, minor, major, prerelease]
        default: patch
      tag:
        type: choice
        required: true
        description: Tag type
        options: [stable, beta]
        default: beta
      build_api:
        type: boolean
        required: false
        description: Generate tag for API
        default: true
      build_wrk:
        type: boolean
        required: false
        description: Generate tag for Worker
        default: true

jobs:
  call-tag-generator:
    uses: vtex/order-management-actions/.github/workflows/tag-generator.yml@main
    with:
      release: ${{ inputs.release }}
      tag: ${{ inputs.tag }}
      build_api: ${{ inputs.build_api }}
      build_wrk: ${{ inputs.build_wrk }}
